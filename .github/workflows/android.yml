name: Published APK installation diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  published-upgrade:
    strategy:
      fail-fast: false
      matrix:
        api: [35, 36]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools build-tools;35.0.0"
      - name: Download and verify the actual public releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for version in 1.3.1 1.3.2; do
            gh release download "v$version" --pattern "SFOBusinessTravel-v$version.apk" --pattern SHA256SUMS --dir "published/$version"
            (cd "published/$version" && sha256sum -c SHA256SUMS)
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "published/$version/SFOBusinessTravel-v$version.apk" > "published/$version/signature-verified.txt"
            test "$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "published/$version/signature-verified.txt")" = "$(cat android/release-certificate.sha256)"
            "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "published/$version/SFOBusinessTravel-v$version.apk" | sed -n '1p'
          done
      - name: Prepare isolated emulator
        run: |
          sudo rm -rf /usr/share/dotnet "${ANDROID_HOME:?}/ndk"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test clean install and historical upgrade with the actual release APKs
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disk-size: 2048M
          emulator-boot-timeout: 300
          disable-animations: true
          script: |
            bash scripts/test-published-fresh.sh published/1.3.2/SFOBusinessTravel-v1.3.2.apk
            bash scripts/test-upgrade.sh published/1.3.1/SFOBusinessTravel-v1.3.1.apk published/1.3.2/SFOBusinessTravel-v1.3.2.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-upgrade-api-${{ matrix.api }}
          path: |
            published/*/signature-verified.txt
            published/*/SHA256SUMS
            test-results/upgrade/
            test-results/fresh/
          if-no-files-found: ignore
