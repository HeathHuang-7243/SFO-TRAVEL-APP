name: Android checks and debug APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - run: npx cap sync android
      - run: ./gradlew assembleDebug lintDebug --no-daemon
        working-directory: android
      - name: Reserve disk space for the emulator
        # Hosted runner only. This app uses prebuilt native libraries, not the NDK.
        run: |
          sudo rm -rf /usr/share/dotnet "${ANDROID_HOME:?}/ndk"
          df -h "$HOME"
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test native SQLite startup and WebView reload
        timeout-minutes: 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disk-size: 2048M
          emulator-boot-timeout: 300
          disable-animations: true
          script: |
            ./android/gradlew -p android :app:connectedDebugAndroidTest --no-daemon
            adb pull /sdcard/Download/test-status-dark.png android/app/build/reports/androidTests/status-dark.png
            adb pull /sdcard/Download/test-status-light.png android/app/build/reports/androidTests/status-light.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-storage-test-results
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
      - uses: actions/upload-artifact@v4
        with:
          name: SFO-TRAVEL-APP-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
