name: Beta checks and signed APK
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: beta-${{ github.ref }}
  cancel-in-progress: true
jobs:
  beta:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Require the requested test version
        run: node -e 'if(require("./package.json").version!=="1.3.4b")process.exit(1)'
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - run: npx cap sync android
      - run: ./gradlew assembleDebug :app:testDebugUnitTest lintDebug --no-daemon
        working-directory: android
      - name: Build fixed-signature beta APK
        env:
          SFO_SIGNING_BUNDLE: ${{ secrets.SFO_SIGNING_BUNDLE }}
        run: node scripts/build-release.mjs
      - name: Verify beta package and original release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir beta baseline
          cp android/app/build/outputs/apk/release/app-release.apk beta/SFOBusinessTravel-v1.3.4b.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs beta/*.apk > beta/signature.txt
          actual="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' beta/signature.txt)"
          test "$actual" = "$(cat android/release-certificate.sha256)"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging beta/*.apk > beta/package-info.txt
          python - <<'PY'
          from pathlib import Path
          info=Path('beta/package-info.txt').read_text().splitlines()[0]
          assert "name='com.heathhuang.sfotravel'" in info
          assert "versionName='1.3.4b'" in info
          assert "versionCode='1003004'" in info
          PY
          (cd beta && sha256sum *.apk > SHA256SUMS)
          gh release download v1.3.4 --repo "$GITHUB_REPOSITORY" --pattern '*.apk' --pattern SHA256SUMS --dir baseline
          (cd baseline && sha256sum -c SHA256SUMS)
      - name: Prepare isolated emulator
        run: |
          sudo rm -rf /usr/share/dotnet "${ANDROID_HOME:?}/ndk"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify native storage and upgrade from the published v1.3.4
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disk-size: 2048M
          emulator-boot-timeout: 300
          disable-animations: true
          script: |
            ./android/gradlew -p android :app:connectedDebugAndroidTest --no-daemon
            bash scripts/test-upgrade.sh baseline/SFOBusinessTravel-v1.3.4.apk beta/SFOBusinessTravel-v1.3.4b.apk
      - name: Upload test APK (no release or tag)
        uses: actions/upload-artifact@v4
        with:
          name: SFOBusinessTravel-v1.3.4b
          path: beta/
          if-no-files-found: error
          retention-days: 14
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beta-test-evidence
          path: |
            test-results/
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 14
