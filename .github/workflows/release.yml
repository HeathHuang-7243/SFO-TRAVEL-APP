name: Signed Android release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Version tag matching package.json (created only after checks pass)
        required: true
        type: string
permissions:
  contents: write
  actions: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Verify release tag
        run: |
          node scripts/verify-release.mjs
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            echo 'Manual releases must use main'; exit 1
          fi
          existing="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}" | awk '/\^\{\}$/ {peeled=$1; next} {direct=$1} END {print peeled ? peeled : direct}')"
          if [ -n "$existing" ] && [ "$existing" != "$GITHUB_SHA" ]; then
            echo 'Release tag already points to a different commit'; exit 1
          fi
      - name: Check signing secrets
        env:
          SFO_SIGNING_BUNDLE: ${{ secrets.SFO_SIGNING_BUNDLE }}
        run: |
          if [ -z "$SFO_SIGNING_BUNDLE" ]; then
            echo 'Missing SFO_SIGNING_BUNDLE. See docs/RELEASING.md.'
            exit 1
          fi
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-browser-test-results
          path: test-results/
          if-no-files-found: ignore
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - run: npx cap sync android
      - name: Build older-version fixture for upgrade verification
        env:
          SFO_SIGNING_BUNDLE: ${{ secrets.SFO_SIGNING_BUNDLE }}
        run: |
          cp package.json "$RUNNER_TEMP/sfo-package.json"
          trap 'cp "$RUNNER_TEMP/sfo-package.json" package.json' EXIT
          node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync("package.json"));p.version="0.0.1";fs.writeFileSync("package.json",JSON.stringify(p))'
          node scripts/build-release.mjs
          cp android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/sfo-upgrade-baseline.apk"
      - name: Build signed APK
        env:
          SFO_SIGNING_BUNDLE: ${{ secrets.SFO_SIGNING_BUNDLE }}
        run: node scripts/build-release.mjs
      - name: Verify and prepare release files
        run: |
          mkdir release
          cp android/app/build/outputs/apk/release/app-release.apk "release/SFOBusinessTravel-$RELEASE_TAG.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "release/SFOBusinessTravel-$RELEASE_TAG.apk" > release/signature.txt
          actual="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' release/signature.txt)"
          test "$actual" = "$(cat android/release-certificate.sha256)"
          cd release
          sha256sum *.apk > SHA256SUMS
      - name: Prepare emulator
        run: |
          sudo rm -rf /usr/share/dotnet "${ANDROID_HOME:?}/ndk"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify signed upgrade preserves local storage
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disk-size: 2048M
          emulator-boot-timeout: 300
          disable-animations: true
          script: bash scripts/test-upgrade.sh "$RUNNER_TEMP/sfo-upgrade-baseline.apk" android/app/build/outputs/apk/release/app-release.apk
      - name: Upload upgrade failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: signed-upgrade-failure
          path: test-results/upgrade/
          if-no-files-found: ignore
      - name: Require Android checks for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=pending
          for attempt in $(seq 1 60); do
            state="$(gh run list --workflow android.yml --commit "$GITHUB_SHA" --branch main --event push --limit 1 --json status,conclusion --jq '.[0] | if .status == "completed" then .conclusion else "pending" end')"
            case "$state" in
              success) break ;;
              failure|cancelled|timed_out|action_required|skipped|stale) echo "Android checks: $state"; exit 1 ;;
            esac
            sleep 15
          done
          test "$state" = success
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/release-notes/$RELEASE_TAG.md"
          if [ -f "$notes" ]; then
            gh release create "$RELEASE_TAG" release/* --target "$GITHUB_SHA" --title "SFOBusinessTravel $RELEASE_TAG" --notes-file "$notes"
          else
            gh release create "$RELEASE_TAG" release/* --target "$GITHUB_SHA" --title "SFOBusinessTravel $RELEASE_TAG" --generate-notes
          fi
